# Paste this block under the [[profiles]] block you want Ryujinx to appear
# in (typically `id = 'user'`, accessed via Wolf UI). Adjust the mounts to
# your host paths.

    [[profiles.apps]]
    icon_png_path = ''
    start_virtual_compositor = true
    title = 'Ryujinx'

        [profiles.apps.runner]
        base_create_json = '''{
  "HostConfig": {
    "IpcMode": "host",
    "Privileged": false,
    "CapAdd": ["NET_RAW", "MKNOD", "NET_ADMIN"],
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}
'''
        devices = []
        env = [ 'RUN_SWAY=true', 'GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/nvidia*' ]
        image = 'ghcr.io/bwees/ryujinx-fedora:latest'
        mounts = [
            '/path/to/switch/roms:/games:rw',
        ]
        name = 'WolfRyujinx'
        ports = []
        type = 'docker'
