name: build-images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ryujinx
            variant: fedora
            build_dir: apps/ryujinx/build-fedora
            base_image: ghcr.io/games-on-whales/base-app:fedora
            image_name: ryujinx-fedora
          - app: ryujinx
            variant: debian
            build_dir: apps/ryujinx/build
            base_image: ghcr.io/games-on-whales/base-app:edge
            image_name: ryujinx-debian
          - app: eglantine
            variant: fedora
            build_dir: apps/eglantine/build-fedora
            base_image: ghcr.io/games-on-whales/base-app:fedora
            image_name: eglantine-fedora
          - app: eglantine
            variant: debian
            build_dir: apps/eglantine/build
            base_image: ghcr.io/games-on-whales/base-app:edge
            image_name: eglantine-debian

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ${{ matrix.image_name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.build_dir }}
          push: true
          build-args: |
            BASE_APP_IMAGE=${{ matrix.base_image }}
            IMAGE_SOURCE=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image_name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,scope=${{ matrix.image_name }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
